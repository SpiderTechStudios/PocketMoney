name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main # Change to your primary branch name if different (e.g., master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java (required for Android/Flutter dependencies during build setup)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install dependencies and build Flutter Web app
      - name: Install Dependencies & Build Web
        run: |
          flutter pub get
          flutter build web --release

      # 5. Deploy build output to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          channelId: live
          projectId: pocketmoneybyjuku # Replace with your actual Firebase project ID